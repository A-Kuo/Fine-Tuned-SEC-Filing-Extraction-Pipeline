name: Kaggle QLoRA Training

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 8 examples, 1 epoch, no upload (minutes, checks every stage); full = the whole training run"
        type: choice
        options:
          - smoke
          - full
        default: smoke
      commit_results:
        description: "Commit notebooks/results/ to main after a FULL run succeeds (off by default)"
        type: boolean
        default: false
      notes:
        description: "Optional note for this training run"
        required: false
        default: ""
  # Uncomment to enable automatic biweekly runs. NOTE: cron has no native
  # biweekly primitive -- verify/adjust this before enabling (a plain weekly
  # cron here would silently fire twice as often as intended):
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  train-on-kaggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pyyaml loguru python-dotenv matplotlib

      - name: Submit training job to Kaggle and wait
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          RUN_MODE: ${{ inputs.mode }}
        run: python scripts/submit_kaggle_job.py --wait --mode "$RUN_MODE"

      - name: Fetch results from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/fetch_kaggle_results.py --status complete

      # The step above is skipped when the kernel fails, which used to throw
      # the kernel log away exactly when it is needed to diagnose the failure.
      - name: Fetch kernel log and output after a failure
        if: failure()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/fetch_kaggle_results.py --logs-only

      - name: Upload run output (adapter, logs, reports) as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-output
          path: |
            .kaggle_output/
            notebooks/results/
          retention-days: 14

      # Results only land on main when explicitly requested for a full run.
      - name: Commit results to repo
        if: ${{ success() && inputs.mode == 'full' && inputs.commit_results }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add notebooks/results/
          git commit -m "Automated Kaggle training results [skip ci]" || exit 0
          git push
